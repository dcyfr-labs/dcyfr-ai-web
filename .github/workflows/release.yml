name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write  # Required for OIDC authentication

env:
  NODE_VERSION: '24.13.0'
  NPM_CONFIG_PROVENANCE: true

jobs:
  release:
    name: Release to npm
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - name: Mint GitHub App token
        id: app-token
        # Only mint when org-level RELEASE_APP_ID is set. `continue-on-error`
        # makes the workflow degrade-safe: if the App isn't installed on this
        # repo yet, or secrets are missing, mint fails non-fatally and the
        # fallback chain picks up RELEASE_TOKEN.
        if: ${{ vars.RELEASE_APP_ID != '' }}
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # PAT with `workflow` scope when available — GITHUB_TOKEN cannot push
          # tags on commits touching .github/workflows/* (server-side reject).
          # Falls back cleanly; degraded mode no-ops tag push for such releases.
          token: ${{ steps.app-token.outputs.token || secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'
          cache: ''  # No cache - package is part of workspace
          # registry-url writes _authToken=${NODE_AUTH_TOKEN} to ~/.npmrc.
          # changesets/action detects OIDC, exchanges JWT for a granular access token,
          # and sets NODE_AUTH_TOKEN — npm reads it from the ~/.npmrc slot above.
      
      - name: Verify OIDC token availability
        run: |
          echo "Checking OIDC environment for Trusted Publisher:"
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" ] && [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL}" ]; then
            echo "✅ OIDC token request environment available"
            echo "✅ Trusted Publisher authentication will be used"
          else
            echo "⚠️ OIDC environment not fully available - may fall back to traditional authentication"
          fi
      
      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install -D @changesets/cli @changesets/changelog-github --legacy-peer-deps

      - name: Upgrade npm for Trusted Publishing
        # Bounded to 11.x on purpose: npm 12 requires node
        # `^22.22.2 || ^24.15.0 || >=26.0.0`, which the 24.13.0 pin above does not
        # satisfy — so `npm@latest` aborts with EBADENGINE and fails the release
        # outright. `^11` keeps the >=11.5 OIDC floor this step exists for.
        # Widen once the node pin moves to >=24.15.0.
        run: npm install -g npm@^11

      - name: Verify npm version for Trusted Publisher
        run: |
          echo "npm version:"
          npm --version
          echo "✅ npm $(npm --version) - Trusted Publisher compatible"
          
          echo "npm configuration:"
          npm config get registry
          npm config get @dcyfr:registry || echo "@dcyfr scope not configured (will use default)"
      
      - name: Run linter
        run: npm run lint
        continue-on-error: true
      
      - name: Type check
        run: npm run typecheck
        continue-on-error: true
      
      - name: Run tests
        run: npm run test:run
        continue-on-error: true
      
      - name: Build package
        run: npm run build
        continue-on-error: true
      
      - name: Create Release Pull Request or Publish with OIDC
        id: changesets
        uses: changesets/action@v1
        with:
          publish: npm run release
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # npm OIDC auth is handled automatically via NPM_CONFIG_PROVENANCE=true
          # No NODE_AUTH_TOKEN needed — Trusted Publisher provides authentication
