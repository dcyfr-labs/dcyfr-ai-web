version: 2
# This repo is DEPRECATED (npm package deprecated 2026-02-27); it is kept only
# as a GitHub starter template. Routine version-bump PRs add maintenance noise
# with little value, so both ecosystems are scoped to security-only updates:
# `open-pull-requests-limit: 0` disables routine version-update PRs while
# Dependabot security updates (which ignore this limit) keep flowing.
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "UTC"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "automated"
      - "dependabot"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "UTC"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "automated"
      - "dependabot"
    commit-message:
      prefix: "ci"
